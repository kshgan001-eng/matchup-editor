<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 브롤스타즈 월드파이널 승부예측. 경기별 세트 점수를 고르고 나만의 대진표를 공유하세요.">
  <title>2026 월드파이널 승부예측</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      background: #132d4a;
      color: #edf4fb;
      --gold: #ffe8a0;
      --focus: #96d7ff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    main { width: 100%; max-width: 2200px; margin: auto; }
    .viewport { overflow-x: auto; scrollbar-color: #7090aa #132d4a; }
    .bracket { display: block; width: 100%; height: auto; }
    .match[aria-disabled="false"] { cursor: pointer; }
    .match:focus { outline: none; }
    .match:focus-visible .card-outline { opacity: 1; stroke: #75cbff; }
    .card-outline { transition: opacity 150ms ease; }
    .winner-bg { transition: opacity 200ms ease; }
    .score-entry { transition: opacity 150ms ease; }

    @media (hover: hover) {
      .match[aria-disabled="false"]:hover .card-outline { opacity: 0.9; }
      .match[aria-disabled="false"]:active .card-outline { opacity: 1; }
    }

    .utilities {
      margin: 0;
      padding: 13px 12px 16px;
      border-top: 1px solid #83a8c52e;
      background: #132d4a;
      text-align: center;
    }

    .tools {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tool, .dialog-button {
      min-height: 42px;
      border: 1px solid #8bafcd50;
      border-radius: 8px;
      padding: 7px 13px;
      background: #ffffff09;
      color: inherit;
      font-size: 0.875rem;
      font-weight: 650;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .tool:hover:not(:disabled), .dialog-button:hover { background: #ffffff16; }
    .tool:disabled { opacity: 0.45; }
    #zoom { display: none; }

    @media (max-width: 850px) {
      #zoom { display: inline-flex; align-items: center; }
      .viewport.is-zoomed .bracket { min-width: 1040px; }
    }

    .feedback {
      display: block;
      min-height: 1.25rem;
      margin-top: 5px;
      color: var(--gold);
      font-size: 0.8rem;
    }

    .fan-notice {
      margin: 0;
      color: #bdcee0;
      font-size: 0.72rem;
    }

    .fan-notice a { color: inherit; text-underline-offset: 2px; }

    dialog {
      width: min(calc(100% - 32px), 430px);
      max-height: calc(100% - 32px);
      margin: auto;
      border: 1px solid #8bafcd58;
      border-radius: 17px;
      padding: 0;
      background: #172e48;
      color: #edf4fb;
      box-shadow: 0 15px 55px #07162490;
      overscroll-behavior: contain;
    }

    dialog[open] { animation: open-dialog 160ms ease-out; }
    dialog::backdrop { background: #08172ca8; }
    @keyframes open-dialog {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dialog-panel { padding: 16px; }
    .dialog-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .dialog-heading h2 { margin: 0; font-size: 1.06rem; }
    .close {
      flex: 0 0 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #dae8f4;
      font-size: 1.5rem;
      line-height: 1;
    }

    .close:hover { background: #ffffff13; }
    .team-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .team-choice { display: flex; flex-direction: column; gap: 6px; }
    .team {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 5px;
      min-height: 73px;
      padding: 0 2px 4px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 750;
    }

    .team svg { display: block; width: 35px; height: 35px; }
    .score-choice {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 43px;
      border: 1px solid #789bbb55;
      border-radius: 8px;
      padding: 0 10px;
      background: #203e5b;
      color: #e5eff9;
      font-size: 1.03rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .score-choice strong { color: var(--gold); }
    .score-choice:hover { background: #2a4b69; border-color: #9bbad4; }
    .score-choice[aria-pressed="true"] {
      border-color: var(--gold);
      background: var(--gold);
      color: #172b40;
    }
    .score-choice[aria-pressed="true"] strong { color: inherit; }
    .score-divider { opacity: 0.66; }
    .dialog-note { margin: 0 0 11px; color: #c8d9e9; font-size: 0.83rem; }
    .dialog-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 13px; }
    .dialog-footer[hidden] { display: none; }
    .dialog-button.emphasis { background: var(--gold); color: #172b40; border-color: var(--gold); }
    .dialog-button.emphasis:hover { background: #fff1c6; }
    .share-url {
      width: 100%;
      min-height: 42px;
      border: 1px solid #8bafcd75;
      border-radius: 8px;
      padding: 8px;
      background: #0f253e;
      color: #edf4fb;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>
</head>

  <script>
(() => {
  "use strict";

  const get = (id) => document.getElementById(id);
  const svg = get("bracket");
  const { matches: definitions, teams: teamInfo } = JSON.parse(get("bracket-data").content.textContent);
  const matchIds = Object.keys(definitions);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const svgNS = "http://www.w3.org/2000/svg";
  const storageKey = "world-finals-2026-picks-v1";
  const hashPrefix = "#p=1.";
  const publicUrl = "https://kshgan001-eng.github.io/matchup-editor/";
  const scoreDialog = get("score-dialog");
  const resetDialog = get("reset-dialog");
  const shareDialog = get("share-dialog");
  const resetButton = get("reset");
  const saveButton = get("save");
  const scoreChoices = get("score-choices");
  const trophy = get("champion-trophy");
  const routes = [...svg.querySelectorAll("[data-advance-to]")];

  function scoreOptions(target, headStart = 0) {
    return [
      ...Array.from({ length: target }, (_, score) => [target, score]),
      ...Array.from({ length: target - headStart }, (_, score) => [score + headStart, target]),
    ];
  }

  const regularScores = scoreOptions(3);
  const finalScores = scoreOptions(4, 1);
  const optionsFor = (id) => id === "GF" ? finalScores : regularScores;

  const cards = Object.fromEntries(matchIds.map((id) => {
    const element = get("match-" + id);
    const rows = [...element.querySelectorAll(".team-row")].map((row) => ({
      highlight: row.querySelector(".winner-bg"),
      content: row.querySelector(".row-content"),
      icon: row.querySelector(".row-content use"),
      name: row.querySelector(".team-name"),
      score: row.querySelector(".team-score"),
      preview: row.querySelector(".slot-preview"),
    }));
    return [id, {
      element,
      rows,
      width: Number(element.querySelector(".card-bg").getAttribute("width")),
    }];
  }));

  function resolvePicks(picks, previousMatches) {
    const matches = {};
    const accepted = {};

    for (const id of matchIds) {
      const participants = definitions[id].slots.map((slot) =>
        slot.seed ?? (slot.winner ? matches[slot.winner].winner : matches[slot.loser].loser)
      );
      const ready = participants.every(Boolean);
      const previousTeams = previousMatches?.[id].participants;
      const sameTeams = !previousTeams || participants.every((team, side) => team === previousTeams[side]);
      const result = ready && sameTeams ? optionsFor(id)[picks[id] - 1] : undefined;
      const winningSide = result ? Number(result[1] > result[0]) : -1;

      if (result) accepted[id] = picks[id];
      matches[id] = {
        participants,
        ready,
        result,
        winningSide,
        winner: participants[winningSide],
        loser: participants[1 - winningSide],
      };
    }

    return { matches, picks: accepted };
  }

  function encodePicks(picks) {
    return matchIds.map((id) => picks[id] ?? 0).join("");
  }

  function decodePicks(encoded) {
    if (!encoded || encoded.length !== matchIds.length || !/^[0-7]+$/.test(encoded)) return null;

    const picks = {};
    for (const [position, id] of matchIds.entries()) {
      const choice = Number(encoded[position]);
      if (choice > 0) picks[id] = choice;
    }
    return picks;
  }

  function readSavedPicks() {
    try {
      return decodePicks(localStorage.getItem(storageKey)) ?? {};
    } catch {
      return {};
    }
  }

  function picksFromLink() {
    return location.hash.startsWith(hashPrefix) ? decodePicks(location.hash.slice(hashPrefix.length)) : null;
  }

  function saveProgress() {
    try {
      if (sharedSession) {
        history.replaceState(null, "", predictionUrl(location.href));
      } else if (Object.keys(state.picks).length) {
        localStorage.setItem(storageKey, encodePicks(state.picks));
      } else {
        localStorage.removeItem(storageKey);
      }
    } catch {
      // Private or embedded browser sessions may restrict history and storage.
    }
  }

  const linkedPicks = picksFromLink();
  let sharedSession = linkedPicks !== null;
  let state = resolvePicks(linkedPicks ?? readSavedPicks());
  let activeMatchId;
  let feedbackTimer;

  function announce(message) {
    get("feedback").textContent = message;
    clearTimeout(feedbackTimer);
    if (message) feedbackTimer = setTimeout(() => { get("feedback").textContent = ""; }, 4200);
  }

  function slotLabel(slot) {
    return slot.label ?? definitions[slot.winner ?? slot.loser].title + (slot.winner ? " 승자" : " 패자");
  }

  function animate(element, keyframes, duration) {
    element.getAnimations().forEach((animation) => animation.cancel());
    element.animate(keyframes, { duration, easing: "cubic-bezier(.2,.7,.3,1)" });
  }

  function render(previousMatches) {
    for (const id of matchIds) {
      const { element, rows, width } = cards[id];
      const match = state.matches[id];
      const previous = previousMatches?.[id];
      const isFinal = id === "GF";
      const shownScores = match.result ?? (isFinal && match.ready ? [1, 0] : []);
      const displayedTeams = [];

      if (match.ready) {
        element.dataset.state = match.result ? "played" : "ready";
      } else {
        element.dataset.state = match.participants.some(Boolean) ? "partial" : "waiting";
      }
      element.setAttribute("role", match.ready ? "button" : "group");
      element.setAttribute("tabindex", match.ready ? "0" : "-1");
      element.setAttribute("aria-disabled", String(!match.ready));

      for (const [side, row] of rows.entries()) {
        const key = match.participants[side];
        const team = teamInfo[key];
        const winner = side === match.winningSide;
        const color = winner ? "#172b40" : "#354c5f";
        row.highlight.setAttribute("opacity", winner ? "1" : "0");
        row.name.setAttribute("fill", color);
        row.score.setAttribute("fill", color);
        row.preview?.setAttribute("visibility", team ? "hidden" : "visible");

        if (team) {
          const availableWidth = width - (isFinal && winner ? 175 : 114);
          row.name.setAttribute("font-size", Math.min(width < 330 ? 40 : 44, Math.floor(availableWidth / team.em)));
          row.icon.setAttribute("href", "#logo-" + key);
          row.icon.removeAttribute("visibility");
        } else {
          row.icon.removeAttribute("href");
          row.icon.setAttribute("visibility", "hidden");
        }

        const score = shownScores[side];
        row.name.textContent = team?.name ?? "";
        row.score.textContent = score ?? "";
        displayedTeams.push((team?.name ?? slotLabel(definitions[id].slots[side])) + (score === undefined ? "" : " " + score));

        if (previous && !reduceMotion.matches && key !== previous.participants[side]) {
          row.content.getAnimations().forEach((animation) => animation.cancel());
          if (key) {
            animate(row.content, [{ opacity: 0, transform: "translateX(-6px)" }, { opacity: 1, transform: "translateX(0)" }], 220);
          }
        }
      }

      const summary = definitions[id].title + ", " + displayedTeams.join(" 대 ");
      const outcome = match.result ? ", " + teamInfo[match.winner].name + " 승리" : "";
      element.setAttribute("aria-label", summary + outcome);
      element.querySelector("title").textContent = summary + outcome;
    }

    const champion = state.matches.GF.winningSide;
    trophy.setAttribute("visibility", champion < 0 ? "hidden" : "visible");
    trophy.setAttribute("transform", champion === 1 ? "translate(0 55)" : "");
    resetButton.disabled = !Object.keys(state.picks).length;

    if (previousMatches && !reduceMotion.matches) {
      for (const route of routes) {
        const id = route.dataset.advanceTo;
        const sides = route.dataset.side === undefined ? [0, 1] : [Number(route.dataset.side)];
        if (sides.some((side) => {
          const team = state.matches[id].participants[side];
          return team && team !== previousMatches[id].participants[side];
        })) {
          animate(route, [{ stroke: "#ffe8a0", opacity: 1 }, { stroke: "#e4edf5", opacity: 0.78 }], 420);
        }
      }
    }
  }

  function teamBadge(key) {
    const badge = document.createElement("div");
    badge.className = "team";
    const icon = document.createElementNS(svgNS, "svg");
    icon.setAttribute("viewBox", "0 0 41 41");
    icon.setAttribute("aria-hidden", "true");
    const use = document.createElementNS(svgNS, "use");
    use.setAttribute("href", "#logo-" + key);
    icon.append(use);
    const name = document.createElement("span");
    name.textContent = teamInfo[key].name;
    badge.append(icon, name);
    return badge;
  }

  function scoreButton(score, winner, winningSide, pick) {
    const button = document.createElement("button");
    button.className = "score-choice";
    button.type = "button";
    button.dataset.pick = pick;
    button.setAttribute("aria-pressed", String(state.picks[activeMatchId] === pick));
    button.setAttribute("aria-label", winner + " 승리, " + score.join("대 "));

    for (const [side, sets] of score.entries()) {
      if (side === 1) {
        const divider = document.createElement("span");
        divider.className = "score-divider";
        divider.textContent = ":";
        button.append(divider);
      }
      const number = document.createElement(side === winningSide ? "strong" : "span");
      number.textContent = sets;
      button.append(number);
    }
    return button;
  }

  function openScoreDialog(id) {
    const match = state.matches[id];
    if (!match.ready || scoreDialog.open) return;

    activeMatchId = id;
    get("score-title").textContent = definitions[id].title;
    get("final-note").hidden = id !== "GF";
    get("clear-score-footer").hidden = !match.result;
    const options = optionsFor(id);
    const columns = match.participants.map((key, side) => {
      const column = document.createElement("div");
      column.className = "team-choice";
      column.append(teamBadge(key));
      for (const [index, score] of options.entries()) {
        if (score[side] > score[1 - side]) column.append(scoreButton(score, teamInfo[key].name, side, index + 1));
      }
      return column;
    });
    scoreChoices.replaceChildren(...columns);
    scoreDialog.showModal();
    (scoreChoices.querySelector('[aria-pressed="true"]') ?? scoreChoices.querySelector("button")).focus();
  }

  function setPick(pick) {
    const id = activeMatchId;
    const previous = state;
    const picks = { ...previous.picks };
    if (pick === null) delete picks[id];
    else picks[id] = pick;

    state = resolvePicks(picks, previous.matches);
    saveProgress();
    render(previous.matches);
    scoreDialog.close();

    if (matchIds.some((other) => other !== id && previous.picks[other] && !state.picks[other])) {
      announce("대진이 바뀐 경기의 점수를 비웠어요.");
    } else {
      announce("");
    }
  }

  function openCard(event) {
    const card = event.target.closest(".match");
    if (card) openScoreDialog(card.id.slice(6));
  }

  svg.addEventListener("click", openCard);
  svg.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      if (!event.target.closest(".match")) return;
      event.preventDefault();
      openCard(event);
    }
  });

  scoreChoices.addEventListener("click", (event) => {
    const choice = event.target.closest("[data-pick]");
    if (choice) setPick(Number(choice.dataset.pick));
  });
  get("clear-score").addEventListener("click", () => setPick(null));
  scoreDialog.addEventListener("close", () => {
    cards[activeMatchId]?.element.focus({ preventScroll: true });
    activeMatchId = undefined;
  });

  for (const dialog of [scoreDialog, resetDialog, shareDialog]) {
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog || event.target.closest("[data-close]")) dialog.close();
    });
  }

  resetButton.addEventListener("click", () => {
    resetDialog.returnValue = "cancel";
    resetDialog.showModal();
  });
  resetDialog.addEventListener("close", () => {
    if (resetDialog.returnValue !== "reset") return;
    state = resolvePicks({});
    saveProgress();
    render();
    cards[matchIds[0]].element.focus({ preventScroll: true });
    announce("대진표를 초기화했어요.");
  });

  get("zoom").addEventListener("click", (event) => {
    const viewport = get("bracket-viewport");
    const zoomed = viewport.classList.toggle("is-zoomed");
    event.currentTarget.setAttribute("aria-pressed", String(zoomed));
    event.currentTarget.textContent = zoomed ? "전체 보기" : "확대 보기";
    if (zoomed) viewport.scrollIntoView({ block: "start" });
  });

  function predictionUrl(base) {
    const url = new URL(base);
    url.hash = hashPrefix + encodePicks(state.picks);
    return url.href;
  }

  get("share").addEventListener("click", async () => {
    const text = predictionUrl(publicUrl);
    try {
      await navigator.clipboard.writeText(text);
      announce("공유 링크를 복사했어요.");
    } catch {
      const input = get("share-url");
      input.value = text;
      shareDialog.showModal();
      input.focus();
      input.select();
    }
  });

  function canvasImage(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((png) => png ? resolve(png) : reject(new Error("PNG export failed")), "image/png");
    });
  }

  saveButton.addEventListener("click", async () => {
    saveButton.disabled = true;
    let posterUrl;
    try {
      const poster = svg.cloneNode(true);
      poster.querySelectorAll(".card-outline, .score-entry").forEach((control) => control.remove());
      const xml = new XMLSerializer().serializeToString(poster);
      posterUrl = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml;charset=utf-8" }));
      const image = new Image();
      image.src = posterUrl;
      await image.decode();

      const canvas = document.createElement("canvas");
      canvas.width = svg.viewBox.baseVal.width;
      canvas.height = svg.viewBox.baseVal.height;
      canvas.getContext("2d").drawImage(image, 0, 0);
      const pngUrl = URL.createObjectURL(await canvasImage(canvas));
      const download = document.createElement("a");
      download.href = pngUrl;
      download.download = "WorldFinals_2026_Pickem.png";
      document.body.append(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 30000);
      announce("대진표 이미지를 저장했어요.");
    } catch {
      announce("이미지를 저장하지 못했어요. 다시 시도해 주세요.");
    } finally {
      if (posterUrl) URL.revokeObjectURL(posterUrl);
      saveButton.disabled = false;
    }
  });

  window.addEventListener("hashchange", () => {
    const incoming = picksFromLink();
    sharedSession = incoming !== null;
    state = resolvePicks(incoming ?? readSavedPicks());
    if (scoreDialog.open) scoreDialog.close();
    render();
  });

  render();
})();
